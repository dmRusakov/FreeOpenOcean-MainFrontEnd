name = "pages"
main = "worker.js"
compatibility_date = "2026-01-01"
account_id = "e80f7161e7cdefe95a5e6def918eb163"

# "On" allows http://localhost and http://127.0.0.1 ports 65500-65550. Any other value blocks it.
[vars]
DEV_MODE = "On"

[[routes]]
pattern = "pages.freeopenocean.com"
custom_domain = true

[[r2_buckets]]
binding = "PAGES"
bucket_name = "foo-pages"
