<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="free_open_onean">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- MapLibre GL JS -->
  <link href='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css' rel='stylesheet' />
  <script src='https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js'></script>
  <script>
    // Keep a straight-down globe through zoom 19, then ease to a flat chart.
    // The Flutter plugin does not set projection or pitch.
    (function () {
      if (!window.maplibregl || !maplibregl.Map || !maplibregl.Map.prototype.setProjection) return;
      var Original = maplibregl.Map;
      var verticalUntilZoom = 19;
      function applyVerticalView(map) {
        map.setProjection({
          type: [
            'interpolate', ['linear'], ['zoom'],
            verticalUntilZoom, 'vertical-perspective',
            verticalUntilZoom + 1, 'mercator'
          ]
        });
        if (map.getZoom() <= verticalUntilZoom) {
          map.setMaxPitch(0);
          if (map.getPitch() > 0) map.setPitch(0);
        } else {
          map.setMaxPitch(60);
        }
      }
      function MapWithGlobe(options) {
        var map = new Original(options);
        // Flutter's web plugin creates GeoJSON source objects with null
        // prototypes. MapLibre 5's worker serializer expects plain objects,
        // including when it resends source options as the camera changes.
        var addSource = map.addSource;
        map.addSource = function (id, source) {
          if (source && source.type === 'geojson') {
            source = JSON.parse(JSON.stringify(source));
          }
          return addSource.call(this, id, source);
        };
        map.on('style.load', function () {
          applyVerticalView(map);
        });
        map.on('zoom', function () {
          if (map.getZoom() <= verticalUntilZoom) {
            if (map.getMaxPitch() !== 0) map.setMaxPitch(0);
            if (map.getPitch() > 0) map.setPitch(0);
          } else if (map.getMaxPitch() === 0) {
            map.setMaxPitch(60);
          }
        });
        return map;
      }
      MapWithGlobe.prototype = Original.prototype;
      maplibregl.Map = MapWithGlobe;
    })();
  </script>
  <script src='https://unpkg.com/maplibre-contour@0.1.0/dist/index.min.js'></script>
  <script>
    // Turns the same terrain tiles the hillshade uses into contour vectors.
    if (window.maplibregl && window.mlcontour) {
      var demSource = new mlcontour.DemSource({
        url: 'https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png',
        encoding: 'terrarium',
        maxzoom: 15,
        worker: true
      });
      demSource.setupMaplibre(maplibregl);
    }
  </script>

  <title>FreeOpenOcean</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Decorative maps must not capture page clicks, scrolling or cursors. */
    .map-background-only .maplibregl-map,
    .map-background-only .maplibregl-canvas-container,
    .map-background-only .maplibregl-canvas {
      pointer-events: none !important;
      cursor: default !important;
    }
    .map-background-only .maplibregl-ctrl {
      pointer-events: auto;
    }
    /* Pin attribution (and compass) flush to the lower-right corner. */
    .maplibregl-ctrl-bottom-right {
      right: 0 !important;
      bottom: 0 !important;
      z-index: 2;
    }
    .maplibregl-ctrl-bottom-right .maplibregl-ctrl {
      margin: 0 !important;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #101619;
      overflow: hidden;
    }
    #loading {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      background-color: #101619;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 9999;
    }
    #loading .spinner {
      width: 80px;
      height: 80px;
      border: 4px solid rgba(255,255,255,0.1);
      border-top: 4px solid #efab85;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #loading .spinner .icon {
      font-size: 45px;
      color: #efab85;
      animation: anti-spin 1s linear infinite;
    }
    #loading .loading {
      margin-top: 24px;
      margin-bottom: 15px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 100;
      color: #b6bcbc;
    }
    #loading .title {
      margin-top: 24px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 30px;
      font-weight: 300;
      color: #b6bcbc;
      letter-spacing: 2px;
    }
    #loading .sub-title {
      margin-top: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 16px;
      font-weight: 300;
      color: #b6bcbc;

    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes anti-spin {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner">
      <span class="icon">⛵</span>
    </div>
    <div class="loading">Loading ...</div>
    <div class="title">FreeOpenOcean.com</div>
    <div class="sub-title">Modern Ocean Charting and Weather Applications.</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
</body>
</html>
